# Netlify config for the clinic dashboard (apps/web).
# In the Netlify UI set Base directory = apps/web; this file is read from there.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# PWA: always fetch the latest service worker so updates roll out immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"
